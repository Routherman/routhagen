version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: routh_agent_mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: whatsapp_bot_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: routh_agent_pma
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "8085:80"
    depends_on:
      - mysql

  redis:
    image: redis:7-alpine
    container_name: routh_agent_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  redis_data:
